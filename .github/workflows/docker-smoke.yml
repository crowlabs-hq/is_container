name: Docker smoke test

on:
  push:
    branches:
      - main
      - test-ci
  pull_request:

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t is_container-smoke .
      - name: Run smoke test inside container
        run: docker run --rm is_container-smoke
